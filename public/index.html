<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tango-mirror</title>
<style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #8884; }
    #status { font-size: 12px; opacity: .7; margin-left: auto; }
    #stage { flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #111; }
    #screen { max-width: 100%; max-height: 100%; touch-action: none; }
    button { padding: 4px 10px; }
</style>
</head>
<body>
<header>
    <span id="devices"></span>
    <button id="refresh">刷新设备</button>
    <button id="btn-back">◀ Back</button>
    <button id="btn-home">● Home</button>
    <button id="btn-recents">■ Recents</button>
    <button id="btn-power">⏻</button>
    <span id="status">idle</span>
</header>
<div id="stage"></div>
<script src="/app.js"></script>
</body>
</html>
